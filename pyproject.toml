[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoinspect"
version = "0.1.0"
description = "Offline Qwen3.5 architecture and intervention workbench"
requires-python = ">=3.11"
dependencies = ["torch", "transformers", "modelscope", "PyYAML", "safetensors", "numpy", "matplotlib", "pytest"]

[project.scripts]
nanoinspect = "nanoinspect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
