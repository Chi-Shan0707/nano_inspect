<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nanoinspect · learn Qwen3.5 from the inside</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand"><b>nanoinspect</b><span data-zh="可解释性工作台">interpretability workbench</span></div>
  <nav id="tabs" aria-label="Views">
    <button data-tab="guide" data-zh="从这里开始">Start here</button>
    <button data-tab="architecture"><span class="n">1</span><span data-zh="架构">Architecture</span></button>
